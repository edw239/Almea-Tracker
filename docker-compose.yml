services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: almea
      POSTGRES_PASSWORD: almea
      POSTGRES_DB: almea_tracker
    ports:
      - "5433:5432"
    volumes:
      - almea_tracker_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U almea -d almea_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  almea_tracker_pg:
